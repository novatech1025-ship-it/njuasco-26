<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1e40af" />
    <link rel="icon" type="image/x-icon" href="njuasco-logo.ico" />
    <link rel="stylesheet" href="style.css" />
    <title>Page Not Found | NJUASCO</title>
    <style>
      .not-found { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .not-found-card { width: min(100%, 680px); padding: 42px; border-radius: 24px; background: #fff; box-shadow: 0 20px 60px rgba(15, 23, 42, .12); }
      .not-found-card h1 { margin: 0 0 12px; font-size: clamp(32px, 7vw, 54px); }
      .not-found-card p { line-height: 1.7; }
      .not-found-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <section class="not-found-card" aria-labelledby="not-found-title">
        <img src="njuasco-logo.png" width="64" height="72" alt="New Juaben Senior High School (NJUASCO) logo" />
        <h1 id="not-found-title">Page not found</h1>
        <p>The page you are looking for may have moved or is no longer available.</p>
        <nav class="not-found-links" aria-label="Main pages">
          <a class="btn btn-p" href="index.html">Home</a>
          <a class="btn btn-g" href="admissions.html">Admissions</a>
          <a class="btn btn-g" href="academics.html">Academics</a>
          <a class="btn btn-g" href="contact.html">Contact</a>
        </nav>
      </section>
    </main>
  </body>
</html>
